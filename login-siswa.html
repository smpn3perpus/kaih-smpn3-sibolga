<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Login Siswa - KAIH SMP Negeri 3 Sibolga</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(135deg, #e8f1ff, #f8fbff);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 500px;
    }

    .card {
      background: white;
      padding: 30px;
      border-radius: 18px;
      box-shadow: 0 8px 30px rgba(0,0,0,.12);
    }

    h1 {
      text-align: center;
      color: #0f4c81;
      margin: 0;
    }

    .subjudul {
      text-align: center;
      color: #666;
      margin: 8px 0 25px;
    }

    h2 {
      color: #0f4c81;
      margin-top: 0;
    }

    label {
      display: block;
      margin-top: 14px;
      margin-bottom: 6px;
      font-weight: bold;
    }

    input,
    select {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 15px;
      background: white;
    }

    button {
      width: 100%;
      border: none;
      padding: 13px;
      border-radius: 9px;
      margin-top: 20px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .btn-login {
      background: #0f4c81;
      color: white;
    }

    .btn-daftar {
      background: #2e7d32;
      color: white;
    }

    .btn-kembali {
      background: #777;
      color: white;
    }

    .link {
      text-align: center;
      margin-top: 20px;
    }

    .link a {
      color: #0f4c81;
      font-weight: bold;
      text-decoration: none;
    }

    .pesan {
      display: none;
      margin-top: 15px;
      padding: 12px;
      border-radius: 8px;
      line-height: 1.5;
    }

    .login-form {
      display: block;
    }

    .daftar-form {
      display: none;
    }
  </style>
</head>

<body>

<div class="container">

  <div class="card">

    <h1>🧑‍🎓 Login Siswa</h1>

    <div class="subjudul">
      KAIH SMP Negeri 3 Sibolga
    </div>


    <!-- ========================= -->
    <!-- LOGIN SISWA -->
    <!-- ========================= -->

    <div id="loginForm" class="login-form">

      <h2>🔐 Masuk</h2>

      <label>NISN</label>

      <input
        type="text"
        id="loginNisn"
        placeholder="Masukkan NISN"
        autocomplete="username"
      >

      <label>Password</label>

      <input
        type="password"
        id="loginPassword"
        placeholder="Masukkan password"
        autocomplete="current-password"
      >

      <button
        class="btn-login"
        onclick="loginSiswa()"
      >
        LOGIN SISWA
      </button>

      <div class="link">
        Belum punya akun?
        <a href="#" onclick="tampilDaftar()">
          Daftar Akun Siswa
        </a>
      </div>

    </div>


    <!-- ========================= -->
    <!-- DAFTAR SISWA -->
    <!-- ========================= -->

    <div id="daftarForm" class="daftar-form">

      <h2>📝 Daftar Akun Siswa</h2>

      <label>Nama Lengkap</label>

      <input
        type="text"
        id="nama"
        placeholder="Masukkan nama lengkap"
      >

      <label>NISN</label>

      <input
        type="text"
        id="nisn"
        placeholder="Masukkan NISN"
      >

      <label>Password</label>

      <input
        type="password"
        id="password"
        placeholder="Minimal 6 karakter"
        autocomplete="new-password"
      >

      <label>Kelas</label>

      <select id="kelas">
        <option value="">Memuat kelas...</option>
      </select>

      <label>Guru Wali</label>

      <select id="guruWali">
        <option value="">Memuat guru...</option>
      </select>

      <button
        class="btn-daftar"
        onclick="daftarSiswa()"
      >
        📝 BUAT AKUN SISWA
      </button>

      <button
        class="btn-kembali"
        onclick="tampilLogin()"
      >
        ← Kembali ke Login
      </button>

    </div>


    <div id="pesan" class="pesan"></div>

  </div>

</div>


<script>

// =====================================================
// SUPABASE
// =====================================================

const SUPABASE_URL =
  "https://nnnvgbajiqlqrsaygxme.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_dHIoPw_gfvud74PH4UCp2w_yGzl9oDy";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


// =====================================================
// PESAN
// =====================================================

function tampilPesan(teks, sukses = false) {

  const box =
    document.getElementById("pesan");

  box.textContent = teks;

  box.style.display = "block";

  box.style.background =
    sukses ? "#e8f5e9" : "#ffebee";

  box.style.color =
    sukses ? "#2e7d32" : "#c62828";
}


// =====================================================
// LOGIN / DAFTAR
// =====================================================

function tampilLogin() {

  document.getElementById("loginForm").style.display =
    "block";

  document.getElementById("daftarForm").style.display =
    "none";

  document.getElementById("pesan").style.display =
    "none";
}


async function tampilDaftar() {

  document.getElementById("loginForm").style.display =
    "none";

  document.getElementById("daftarForm").style.display =
    "block";

  document.getElementById("pesan").style.display =
    "none";

  await ambilKelas();

  await ambilGuru();
}


// =====================================================
// AMBIL KELAS
// =====================================================

async function ambilKelas() {

  const hasil =
    await supabaseClient
      .from("kelas")
      .select("*");

  if (hasil.error) {

    tampilPesan(
      "Gagal mengambil kelas: " +
      hasil.error.message
    );

    return;
  }

  const select =
    document.getElementById("kelas");

  select.innerHTML =
    '<option value="">Pilih kelas</option>';

  (hasil.data || []).forEach(function(kelas) {

    const nama =
      kelas.nama ||
      kelas.name ||
      kelas.nama_kelas ||
      kelas.kelas ||
      "-";

    const option =
      document.createElement("option");

    option.value = kelas.id;

    option.textContent = nama;

    select.appendChild(option);

  });

}


// =====================================================
// AMBIL GURU
// =====================================================

async function ambilGuru() {

  const hasil =
    await supabaseClient
      .from("guru")
      .select("*");

  if (hasil.error) {

    tampilPesan(
      "Gagal mengambil guru: " +
      hasil.error.message
    );

    return;
  }

  const select =
    document.getElementById("guruWali");

  select.innerHTML =
    '<option value="">Pilih guru wali</option>';

  (hasil.data || []).forEach(function(guru) {

    const nama =
      guru.nama ||
      guru.name ||
      guru.nama_guru ||
      guru.guru ||
      "-";

    const option =
      document.createElement("option");

    option.value = guru.id;

    option.textContent = nama;

    select.appendChild(option);

  });

}


// =====================================================
// DAFTAR SISWA
// =====================================================

async function daftarSiswa() {

  const nama =
    document.getElementById("nama").value.trim();

  const nisn =
    document.getElementById("nisn").value.trim();

  const password =
    document.getElementById("password").value;

  const kelas_id =
    document.getElementById("kelas").value;

  const guru_wali_id =
    document.getElementById("guruWali").value;


  if (
    !nama ||
    !nisn ||
    !password ||
    !kelas_id ||
    !guru_wali_id
  ) {

    tampilPesan(
      "Semua data harus diisi."
    );

    return;
  }


  if (password.length < 6) {

    tampilPesan(
      "Password minimal 6 karakter."
    );

    return;
  }


  tampilPesan(
    "Membuat akun siswa..."
  );


  const hasil =
    await supabaseClient.functions.invoke(
      "buat-akun-siswa",
      {
        body: {
          nama: nama,
          nisn: nisn,
          password: password,
          kelas_id: kelas_id,
          guru_wali_id: guru_wali_id
        }
      }
    );


  if (hasil.error) {

    tampilPesan(
      "Gagal membuat akun: " +
      hasil.error.message
    );

    return;
  }


  const data =
    hasil.data;


  if (!data || !data.success) {

    tampilPesan(
      data?.message ||
      "Gagal membuat akun siswa."
    );

    return;
  }


  tampilPesan(
    "🎉 Akun siswa berhasil dibuat! Silakan login menggunakan NISN.",
    true
  );


  document.getElementById("loginNisn").value =
    nisn;

  document.getElementById("loginPassword").value =
    "";

  setTimeout(function() {

    tampilLogin();

  }, 2000);

}


// =====================================================
// LOGIN SISWA
// =====================================================

async function loginSiswa() {

  const nisn =
    document
      .getElementById("loginNisn")
      .value
      .trim();

  const password =
    document
      .getElementById("loginPassword")
      .value;


  if (!nisn || !password) {

    tampilPesan(
      "NISN dan password harus diisi."
    );

    return;
  }


  // Email internal dibuat sama
  // dengan yang dibuat oleh Edge Function.

  const email =
    nisn +
    "@gmail.com";


  tampilPesan(
    "Memeriksa login..."
  );


  const hasil =
    await supabaseClient.auth.signInWithPassword({

      email: email,

      password: password

    });


  if (hasil.error) {

    tampilPesan(
      "Login gagal: " +
      hasil.error.message
    );

    return;
  }


  window.location.href =
    "dashboard.html";

}

</script>

</body>
</html>
