<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Kehadiran Siswa - KAIH</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      background: #f4f7fb;
      color: #222;
    }

    .header {
      background: #0f4c81;
      color: white;
      padding: 22px 15px;
      text-align: center;
    }

    .container {
      max-width: 900px;
      margin: 25px auto;
      padding: 0 15px;
    }

    .card {
      background: white;
      border-radius: 15px;
      padding: 22px;
      margin-bottom: 20px;
      box-shadow: 0 4px 15px rgba(0,0,0,.08);
    }

    h2 {
      margin-top: 0;
      color: #0f4c81;
    }

    .status-buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin-top: 15px;
    }

    .status-buttons button {
      border: none;
      border-radius: 10px;
      padding: 16px 8px;
      color: white;
      font-weight: bold;
      cursor: pointer;
      font-size: 15px;
    }

    .hadir {
      background: #2e7d32;
    }

    .sakit {
      background: #f9a825;
    }

    .izin {
      background: #1565c0;
    }

    .alpa {
      background: #c62828;
    }

    .info {
      background: #eef5ff;
      border-radius: 10px;
      padding: 14px;
      margin-bottom: 15px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 15px;
    }

    th,
    td {
      border: 1px solid #ddd;
      padding: 10px;
      text-align: center;
    }

    th {
      background: #0f4c81;
      color: white;
    }

    .badge {
      display: inline-block;
      padding: 5px 9px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: bold;
    }

    .badge-hadir {
      background: #e8f5e9;
      color: #2e7d32;
    }

    .badge-sakit {
      background: #fff8e1;
      color: #f57f17;
    }

    .badge-izin {
      background: #e3f2fd;
      color: #1565c0;
    }

    .badge-alpa {
      background: #ffebee;
      color: #c62828;
    }

    .badge-belum {
      background: #eeeeee;
      color: #555;
    }

    .badge-verif {
      background: #e8f5e9;
      color: #2e7d32;
    }

    .kembali {
      display: block;
      text-align: center;
      background: #555;
      color: white;
      text-decoration: none;
      padding: 13px;
      border-radius: 9px;
      margin-top: 20px;
    }

    .pesan {
      padding: 12px;
      border-radius: 8px;
      margin-top: 15px;
      display: none;
    }

    .rekap {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin-top: 15px;
    }

    .rekap div {
      padding: 15px;
      border-radius: 10px;
      text-align: center;
      background: #f5f5f5;
    }

    .rekap strong {
      display: block;
      font-size: 24px;
      margin-top: 5px;
    }

    @media(max-width:600px) {
      .status-buttons,
      .rekap {
        grid-template-columns: repeat(2, 1fr);
      }

      table {
        font-size: 13px;
      }
    }
  </style>
</head>

<body>

<div class="header">
  <h1>📋 Kehadiran Siswa</h1>
  <p>SMP Negeri 3 Sibolga</p>
</div>

<div class="container">

  <div class="card">

    <h2>👋 <span id="namaSiswa">Memuat...</span></h2>

    <div class="info">
      <strong>NISN:</strong>
      <span id="nisnSiswa">-</span>
      <br><br>

      <strong>Kelas:</strong>
      <span id="kelasSiswa">-</span>
    </div>

    <h2>📅 Kehadiran Hari Ini</h2>

    <p>
      Tanggal:
      <strong id="tanggalHariIni">-</strong>
    </p>

    <div class="status-buttons">

      <button class="hadir"
        onclick="simpanKehadiran('Hadir')">
        🟢<br>HADIR
      </button>

      <button class="sakit"
        onclick="simpanKehadiran('Sakit')">
        🟡<br>SAKIT
      </button>

      <button class="izin"
        onclick="simpanKehadiran('Izin')">
        🔵<br>IZIN
      </button>

      <button class="alpa"
        onclick="simpanKehadiran('Alpa')">
        🔴<br>ALPA
      </button>

    </div>

    <div id="pesan" class="pesan"></div>

  </div>


  <div class="card">

    <h2>📊 Rekap Kehadiran Bulan Ini</h2>

    <p id="namaBulan">-</p>

    <div class="rekap">

      <div>
        🟢 Hadir
        <strong id="jumlahHadir">0</strong>
      </div>

      <div>
        🟡 Sakit
        <strong id="jumlahSakit">0</strong>
      </div>

      <div>
        🔵 Izin
        <strong id="jumlahIzin">0</strong>
      </div>

      <div>
        🔴 Alpa
        <strong id="jumlahAlpa">0</strong>
      </div>

    </div>

  </div>


  <div class="card">

    <h2>📖 Jurnal Kehadiran Bulan Ini</h2>

    <div style="overflow-x:auto;">

      <table>

        <thead>
          <tr>
            <th>Tanggal</th>
            <th>Status Siswa</th>
            <th>Verifikasi Guru</th>
          </tr>
        </thead>

        <tbody id="tabelKehadiran">

          <tr>
            <td colspan="3">
              Memuat data...
            </td>
          </tr>

        </tbody>

      </table>

    </div>

  </div>


  <a href="dashboard-siswa.html" class="kembali">
    ← Kembali ke Dashboard Siswa
  </a>

</div>


<script>

const SUPABASE_URL =
  "https://nnnvgbajiqlqrsaygxme.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_dHIoPw_gfvud74PH4UCp2w_yGzl9oDy";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


let siswaLogin = null;


// =====================================
// TAMPIL PESAN
// =====================================

function tampilPesan(teks, sukses = false) {

  const box =
    document.getElementById("pesan");

  box.textContent = teks;

  box.style.display = "block";

  box.style.background =
    sukses ? "#e8f5e9" : "#ffebee";

  box.style.color =
    sukses ? "#2e7d32" : "#c62828";
}


// =====================================
// FORMAT TANGGAL
// =====================================

function formatTanggal(tanggal) {

  return new Date(tanggal + "T00:00:00")
    .toLocaleDateString(
      "id-ID",
      {
        day: "2-digit",
        month: "long",
        year: "numeric"
      }
    );
}


// =====================================
// CEK LOGIN
// =====================================

async function mulai() {

  const hasil =
    await supabaseClient.auth.getUser();

  const user =
    hasil.data.user;

  if (!user) {

    window.location.href =
      "login-siswa.html";

    return;
  }


  const nisn =
    user.email.split("@")[0];


  const siswa =
    await supabaseClient
      .from("siswa")
      .select("*")
      .eq("nisn", nisn)
      .maybeSingle();


  if (siswa.error || !siswa.data) {

    tampilPesan(
      "Data siswa tidak ditemukan."
    );

    return;
  }


  siswaLogin =
    siswa.data;


  document.getElementById(
    "namaSiswa"
  ).textContent =
    siswaLogin.nama || "-";


  document.getElementById(
    "nisnSiswa"
  ).textContent =
    siswaLogin.nisn || "-";


  // Ambil kelas
  if (siswaLogin.kelas_id) {

    const kelas =
      await supabaseClient
        .from("kelas")
        .select("*")
        .eq("id", siswaLogin.kelas_id)
        .maybeSingle();

    if (kelas.data) {

      document.getElementById(
        "kelasSiswa"
      ).textContent =
        kelas.data.nama ||
        kelas.data.nama_kelas ||
        kelas.data.name ||
        "-";
    }
  }


  const sekarang =
    new Date();

  document.getElementById(
    "tanggalHariIni"
  ).textContent =
    sekarang.toLocaleDateString(
      "id-ID",
      {
        day: "2-digit",
        month: "long",
        year: "numeric"
      }
    );


  document.getElementById(
    "namaBulan"
  ).textContent =
    sekarang.toLocaleDateString(
      "id-ID",
      {
        month: "long",
        year: "numeric"
      }
    );


  await cekHariIni();

  await ambilRekap();

}


// =====================================
// TANGGAL HARI INI
// =====================================

function tanggalHariIniISO() {

  const sekarang =
    new Date();

  const tahun =
    sekarang.getFullYear();

  const bulan =
    String(
      sekarang.getMonth() + 1
    ).padStart(2, "0");

  const hari =
    String(
      sekarang.getDate()
    ).padStart(2, "0");

  return (
    tahun +
    "-" +
    bulan +
    "-" +
    hari
  );
}


// =====================================
// SIMPAN KEHADIRAN
// =====================================

async function simpanKehadiran(status) {

  if (!siswaLogin) {

    tampilPesan(
      "Data siswa belum siap."
    );

    return;
  }


  const tanggal =
    tanggalHariIniISO();


  const cek =
    await supabaseClient
      .from("kehadiran")
      .select("id")
      .eq("siswa_id", siswaLogin.id)
      .eq("tanggal", tanggal)
      .maybeSingle();


  if (cek.data) {

    tampilPesan(
      "Kehadiran hari ini sudah diisi."
    );

    return;
  }


  const hasil =
    await supabaseClient
      .from("kehadiran")
      .insert({
        siswa_id: siswaLogin.id,
        tanggal: tanggal,
        status_siswa: status,
        status_verifikasi: "Belum diverifikasi",
        status_final: status
      });


  if (hasil.error) {

    tampilPesan(
      "Gagal menyimpan kehadiran: " +
      hasil.error.message
    );

    return;
  }


  tampilPesan(
    "Kehadiran " +
    status +
    " berhasil disimpan.",
    true
  );


  await ambilRekap();

}


// =====================================
// CEK KEHADIRAN HARI INI
// =====================================

async function cekHariIni() {

  if (!siswaLogin) return;


  const hasil =
    await supabaseClient
      .from("kehadiran")
      .select("*")
      .eq(
        "siswa_id",
        siswaLogin.id
      )
      .eq(
        "tanggal",
        tanggalHariIniISO()
      )
      .maybeSingle();


  if (hasil.data) {

    tampilPesan(
      "Kehadiran hari ini sudah diisi: " +
      hasil.data.status_siswa,
      true
    );
  }

}


// =====================================
// REKAP BULAN INI
// =====================================

async function ambilRekap() {

  if (!siswaLogin) return;


  const sekarang =
    new Date();


  const tahun =
    sekarang.getFullYear();


  const bulan =
    sekarang.getMonth();


  const awalBulan =
    tahun +
    "-" +
    String(
      bulan + 1
    ).padStart(2, "0") +
    "-01";


  const akhirBulan =
    new Date(
      tahun,
      bulan + 1,
      0
    );


  const akhir =
    tahun +
    "-" +
    String(
      bulan + 1
    ).padStart(2, "0") +
    "-" +
    String(
      akhirBulan.getDate()
    ).padStart(2, "0");


  const hasil =
    await supabaseClient
      .from("kehadiran")
      .select("*")
      .eq(
        "siswa_id",
        siswaLogin.id
      )
      .gte(
        "tanggal",
        awalBulan
      )
      .lte(
        "tanggal",
        akhir
      )
      .order(
        "tanggal",
        {
          ascending: false
        }
      );


  if (hasil.error) {

    document.getElementById(
      "tabelKehadiran"
    ).innerHTML =
      `<tr>
        <td colspan="3">
          Gagal mengambil data.
        </td>
      </tr>`;

    return;
  }


  let hadir = 0;
  let sakit = 0;
  let izin = 0;
  let alpa = 0;


  const data =
    hasil.data || [];


  data.forEach(function(row) {

    const status =
      row.status_final ||
      row.status_siswa;


    if (status === "Hadir")
      hadir++;

    if (status === "Sakit")
      sakit++;

    if (status === "Izin")
      izin++;

    if (
      status === "Alpa" ||
      status === "Absen tanpa keterangan"
    )
      alpa++;

  });


  document.getElementById(
    "jumlahHadir"
  ).textContent = hadir;


  document.getElementById(
    "jumlahSakit"
  ).textContent = sakit;


  document.getElementById(
    "jumlahIzin"
  ).textContent = izin;


  document.getElementById(
    "jumlahAlpa"
  ).textContent = alpa;


  const tbody =
    document.getElementById(
      "tabelKehadiran"
    );


  if (data.length === 0) {

    tbody.innerHTML =
      `<tr>
        <td colspan="3">
          Belum ada data kehadiran bulan ini.
        </td>
      </tr>`;

    return;
  }


  tbody.innerHTML = "";


  data.forEach(function(row) {

    let statusClass =
      "badge-belum";


    if (row.status_final === "Hadir")
      statusClass =
        "badge-hadir";

    if (row.status_final === "Sakit")
      statusClass =
        "badge-sakit";

    if (row.status_final === "Izin")
      statusClass =
        "badge-izin";

    if (row.status_final === "Alpa")
      statusClass =
        "badge-alpa";


    const verifikasi =
      row.status_verifikasi ||
      "Belum diverifikasi";


    const verifClass =
      verifikasi === "Terverifikasi"
        ? "badge-verif"
        : "badge-belum";


    const tr =
      document.createElement("tr");


    tr.innerHTML = `
      <td>${formatTanggal(row.tanggal)}</td>

      <td>
        <span class="badge ${statusClass}">
          ${row.status_final || row.status_siswa}
        </span>
      </td>

      <td>
        <span class="badge ${verifClass}">
          ${verifikasi}
        </span>
      </td>
    `;


    tbody.appendChild(tr);

  });

}


mulai();

</script>

</body>
</html>
