<script>

const SUPABASE_URL =
"https://nnnvgbajiqlqrsaygxme.supabase.co";

const SUPABASE_KEY =
"sb_publishable_dHIoPw_gfvud74PH4UCp2w_yGzl9oDy";

const supabaseClient =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


let guruLogin = null;
let siswaWali = [];


// =====================================
// PESAN
// =====================================

function tampilPesan(teks,sukses=false){

  const box =
    document.getElementById("pesan");

  box.textContent = teks;

  box.className =
    "pesan " +
    (sukses ? "sukses" : "gagal");

  box.style.display = "block";
}


// =====================================
// MULAI
// =====================================

async function mulai(){

  const hasil =
    await supabaseClient.auth.getUser();

  const user =
    hasil.data.user;

  if(!user){

    location.href =
      "login-guru.html";

    return;
  }


  const guru =
    await supabaseClient
      .from("guru")
      .select(
        "id,nama,username,auth_user_id"
      )
      .eq(
        "auth_user_id",
        user.id
      )
      .maybeSingle();


  if(
    guru.error ||
    !guru.data
  ){

    alert(
      "Akun login tidak terdaftar sebagai Guru."
    );

    await supabaseClient.auth.signOut();

    location.href =
      "login-guru.html";

    return;
  }


  guruLogin =
    guru.data;


  document.getElementById(
    "namaGuru"
  ).textContent =
    guruLogin.nama || "-";


  document.getElementById(
    "usernameGuru"
  ).textContent =
    guruLogin.username || "-";


  const sekarang =
    new Date();

  const tahun =
    sekarang.getFullYear();

  const bulan =
    String(
      sekarang.getMonth()+1
    ).padStart(2,"0");

  const hari =
    String(
      sekarang.getDate()
    ).padStart(2,"0");


  document.getElementById(
    "tanggal"
  ).value =
    `${tahun}-${bulan}-${hari}`;


  await ambilSiswa();

  await ambilJurnal();

}


// =====================================
// SISWA WALI
// =====================================

async function ambilSiswa(){

  const hasil =
    await supabaseClient
      .from("siswa")
      .select(
        "id,nama,nisn,kelas_id"
      )
      .eq(
        "guru_wali_id",
        guruLogin.id
      )
      .order(
        "nama",
        {
          ascending:true
        }
      );


  if(hasil.error){

    document.getElementById(
      "loading"
    ).textContent =
      "Gagal mengambil siswa: " +
      hasil.error.message;

    return;
  }


  siswaWali =
    hasil.data || [];


  document.getElementById(
    "jumlahSiswa"
  ).textContent =
    siswaWali.length;


  document.getElementById(
    "loading"
  ).style.display =
    "none";


  document.getElementById(
    "daftar"
  ).style.display =
    "block";

}


// =====================================
// AMBIL JURNAL
// =====================================

async function ambilJurnal(){

  const tanggal =
    document.getElementById(
      "tanggal"
    ).value;


  if(!tanggal){

    tampilPesan(
      "Silakan pilih tanggal."
    );

    return;
  }


  const daftar =
    document.getElementById(
      "daftar"
    );


  if(siswaWali.length===0){

    daftar.innerHTML = `
      <div class="loading">
        Belum ada siswa yang menjadi siswa wali Anda.
      </div>
    `;

    return;
  }


  const ids =
    siswaWali.map(
      siswa => siswa.id
    );


  const hasil =
    await supabaseClient
      .from("jurnal_7_kaih")
      .select("*")
      .eq(
        "tanggal",
        tanggal
      )
      .in(
        "siswa_id",
        ids
      );


  if(hasil.error){

    daftar.innerHTML = `
      <div class="pesan gagal"
           style="display:block">

        Gagal membaca jurnal 7 KAIH.

        <br><br>

        ${hasil.error.message}

      </div>
    `;

    return;
  }


  const data =
    hasil.data || [];


  daftar.innerHTML = "";


  siswaWali.forEach(
    (siswa,index)=>{

      const row =
        data.find(
          item =>
            Number(item.siswa_id) ===
            Number(siswa.id)
        );


      buatFormSiswa(
        siswa,
        row || {},
        index
      );

    }
  );

}

// SIMPAN JURNAL
// =====================================

async function simpanJurnal(
  siswaId
){

  const tanggal =
    document.getElementById(
      "tanggal"
    ).value;


  if(!tanggal){

    tampilPesan(
      "Tanggal belum dipilih."
    );

    return;
  }


  if(!guruLogin){

    tampilPesan(
      "Data guru belum tersedia."
    );

    return;
  }


  const data = {

    siswa_id:
      siswaId,

    tanggal:
      tanggal,

    guru_id:
      guruLogin.id,

    jam_bangun:
      document.getElementById(
        `bangun_${siswaId}`
      ).value || null,


    puasa:
      document.getElementById(
        `puasa_${siswaId}`
      ).value || null,


    menu_sarapan:
      document.getElementById(
        `sarapan_${siswaId}`
