<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KAIH SMP Negeri 3 Sibolga</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #0f4c81, #1976d2);
    }

    .login-box {
      width: 90%;
      max-width: 420px;
      background: white;
      padding: 35px;
      border-radius: 18px;
      box-shadow: 0 10px 30px rgba(0,0,0,.2);
      text-align: center;
    }

    h1 {
      color: #0f4c81;
      margin-bottom: 5px;
    }

    .subtitle {
      color: #666;
      margin-bottom: 25px;
    }

    input {
      width: 100%;
      padding: 13px;
      margin: 8px 0;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 13px;
      margin-top: 15px;
      border: none;
      border-radius: 8px;
      background: #0f4c81;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
    }

    #pesan {
      margin-top: 15px;
      font-size: 14px;
    }
  </style>
</head>

<body>

<div class="login-box">

  <h1>KAIH</h1>

  <div class="subtitle">
    SMP Negeri 3 Sibolga
  </div>

  <input
    type="email"
    id="email"
    placeholder="Email"
  >

  <input
    type="password"
    id="password"
    placeholder="Password"
  >

  <button id="loginBtn" onclick="login()">
    LOGIN
  </button>

  <div id="pesan"></div>

</div>

<script>

  // =====================================
  // SUPABASE
  // =====================================

  const SUPABASE_URL = "https://nnnvgbajiqlqrsaygxme.supabase.co";
  const SUPABASE_KEY = "sb_publishable_dHIoPw_gfvud74PH4UCp2w_yGzl9oDy";

  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  // =====================================
  // LOGIN
  // =====================================

  async function login() {

    const email =
      document.getElementById("email").value.trim();

    const password =
      document.getElementById("password").value;

    const pesan =
      document.getElementById("pesan");

    const tombol =
      document.getElementById("loginBtn");

    if (!email || !password) {

      pesan.textContent =
        "Email dan password harus diisi.";

      return;
    }

    tombol.disabled = true;

    pesan.textContent = "Memeriksa login...";

    const { data, error } =
      await supabaseClient.auth.signInWithPassword({
        email: email,
        password: password
      });

    if (error) {

      pesan.textContent =
        "Login gagal: " + error.message;

      tombol.disabled = false;

      return;
    }

    pesan.textContent =
      "Login berhasil!";

    setTimeout(() => {

      window.location.href = "dashboard.html";

    }, 800);

  }

</script>

</body>
</html>
