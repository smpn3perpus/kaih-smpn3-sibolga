/* =====================================================
   TANGGAL HARI INI
===================================================== */

function tanggalHariIni(){

  const sekarang = new Date();

  const tahun =
    sekarang.getFullYear();

  const bulan =
    String(
      sekarang.getMonth() + 1
    ).padStart(2,"0");

  const hari =
    String(
      sekarang.getDate()
    ).padStart(2,"0");

  return `${tahun}-${bulan}-${hari}`;
}


/* =====================================================
   PESAN
===================================================== */

function tampilPesan(
  teks,
  sukses = false
){

  const box =
    document.getElementById("pesan");

  if(!box) return;

  box.textContent =
    teks;

  box.className =
    "pesan " +
    (
      sukses
      ? "sukses"
      : "gagal"
    );

  box.style.display =
    "block";
}


/* =====================================================
   RADIO VALUE
===================================================== */

function radioValue(nama){

  const elemen =
    document.querySelector(
      `input[name="${nama}"]:checked`
    );

  return elemen
    ? elemen.value
    : "";
}


/* =====================================================
   SET RADIO
===================================================== */

function setRadio(
  nama,
  nilai
){

  document
    .querySelectorAll(
      `input[name="${nama}"]`
    )
    .forEach(
      function(input){

        input.checked =
          input.value === nilai;

      }
    );

}


/* =====================================================
   CEK LOGIN
===================================================== */

async function cekLogin(){

  try{

    const hasil =
      await supabaseClient
        .auth
        .getUser();

    if(hasil.error){

      throw hasil.error;

    }

    const user =
      hasil.data.user;

    if(!user){

      window.location.href =
        "login-siswa.html";

      return;

    }

    await ambilSiswa(user);

    const tanggal =
      document.getElementById(
        "tanggal"
      );

    if(tanggal){

      tanggal.value =
        tanggalHariIni();

    }

    await muatJurnal();

  }
  catch(error){

    console.error(
      "ERROR CEK LOGIN:",
      error
    );

    tampilPesan(
      "❌ Terjadi kesalahan: " +
      (error.message || error)
    );

  }

}

/* =====================================================
   AMBIL ULANG GURU WALI
   UNTUK MEMASTIKAN guru_id TIDAK NULL
===================================================== */

async function ambilGuruWaliTerbaru(){

  if(!siswaLogin){

    throw new Error(
      "Data siswa belum tersedia."
    );

  }


  console.log(
    "Mengambil ulang data guru wali..."
  );


  const hasil =
    await supabaseClient
      .from("siswa")
      .select(`
        id,
        guru_wali_id
      `)
      .eq(
        "id",
        siswaLogin.id
      )
      .maybeSingle();


  if(hasil.error){

    console.error(
      "ERROR AMBIL GURU WALI:",
      hasil.error
    );

    throw hasil.error;

  }


  if(!hasil.data){

    throw new Error(
      "Data siswa tidak ditemukan."
    );

  }


  const guruId =
    hasil.data.guru_wali_id;


  console.log(
    "HASIL GURU_WALI_ID TERBARU:",
    guruId
  );


  if(
    guruId === null ||
    guruId === undefined ||
    guruId === ""
  ){

    throw new Error(
      "Guru wali siswa belum terhubung. Kolom guru_wali_id pada tabel siswa masih kosong."
    );

  }


  /*
     Karena guru.id dan jurnal.guru_id
     menggunakan INT8, kita pastikan
     nilainya berupa angka.
  */

  const guruIdInt =
    Number(guruId);


  if(
    !Number.isInteger(guruIdInt)
  ){

    throw new Error(
      "guru_wali_id bukan angka INT8 yang valid: " +
      guruId
    );

  }


  /* =================================================
     PASTIKAN GURU MEMANG ADA
  ================================================= */

  const guru =
    await supabaseClient
      .from("guru")
      .select("id")
      .eq(
        "id",
        guruIdInt
      )
      .maybeSingle();


  if(guru.error){

    console.error(
      "ERROR CEK GURU:",
      guru.error
    );

    throw guru.error;

  }


  if(!guru.data){

    throw new Error(
      "Guru dengan ID " +
      guruIdInt +
      " tidak ditemukan pada tabel guru."
    );

  }


  console.log(
    "GURU VALID:",
    guru.data
  );


  return guruIdInt;

}


/* =====================================================
   MUAT JURNAL
===================================================== */

async function muatJurnal(){

  if(!siswaLogin){

    return;

  }


  const tanggalElement =
    document.getElementById(
      "tanggal"
    );


  if(!tanggalElement){

    return;

  }


  const tanggal =
    tanggalElement.value;


  if(!tanggal){

    tampilPesan(
      "Silakan pilih tanggal jurnal."
    );

    return;

  }


  const loading =
    document.getElementById(
      "loading"
    );

  const form =
    document.getElementById(
      "formJurnal"
    );


  if(loading){

    loading.style.display =
      "block";

  }


  if(form){

    form.classList.add(
      "hidden"
    );

  }


  try{

    const hasil =
      await supabaseClient
        .from("jurnal_7_kaih")
        .select("*")
        .eq(
          "siswa_id",
          siswaLogin.id
        )
        .eq(
          "tanggal",
          tanggal
        )
        .maybeSingle();


    if(hasil.error){

      console.error(
        "ERROR MUAT JURNAL:",
        hasil.error
      );


      if(loading){

        loading.innerHTML =
          "❌ Gagal mengambil jurnal: " +
          hasil.error.message;

      }

      return;

    }


    jurnalAktif =
      hasil.data || null;


    if(jurnalAktif){

      isiForm(
        jurnalAktif
      );

      tampilFeedback(
        jurnalAktif
      );

    }
    else{

      kosongkanForm();


      const feedback =
        document.getElementById(
          "feedback"
        );


      if(feedback){

        feedback.classList.add(
          "hidden"
        );

      }

    }


    if(loading){

      loading.style.display =
        "none";

    }


    if(form){

      form.classList.remove(
        "hidden"
      );

    }


    tampilPesan(
      jurnalAktif
      ?
      "📖 Jurnal ditemukan. Anda dapat melihat atau memperbarui isian."
      :
      "📝 Silakan isi jurnal untuk tanggal tersebut.",
      true
    );

  }
  catch(error){

    console.error(
      "ERROR MUAT JURNAL:",
      error
    );


    if(loading){

      loading.innerHTML =
        "❌ Terjadi kesalahan: " +
        error.message;

    }

  }

}

/* =====================================================
   KOSONGKAN FORM
===================================================== */

function kosongkanForm(){

  const jamBangun =
    document.getElementById(
      "jam_bangun"
    );

  if(jamBangun){

    jamBangun.value = "";

  }


  document
    .querySelectorAll(
      'input[type="radio"]'
    )
    .forEach(
      function(input){

        input.checked =
          false;

      }
    );


  const ids = [

    "menu_sarapan",
    "menu_siang",
    "menu_malam",
    "menu_sahur",
    "menu_berbuka",

    "jenis_olahraga",
    "durasi_olahraga",
    "alasan_olahraga",

    "jenis_bermasyarakat",
    "alasan_bermasyarakat",

    "materi_belajar",
    "durasi_belajar",
    "alasan_belajar",

    "jenis_ibadah",
    "alasan_ibadah",

    "jam_tidur"

  ];


  ids.forEach(
    function(id){

      const el =
        document.getElementById(id);

      if(el){

        el.value = "";

      }

    }
  );


  ubahOlahraga();
  ubahBermasyarakat();
  ubahBelajar();
  ubahIbadah();

}

  /* =================================================

/* =====================================================
   FEEDBACK GURU
===================================================== */

function tampilFeedback(row){

  const box =
    document.getElementById(
      "feedback"
    );

  const isi =
    document.getElementById(
      "isiFeedback"
    );


  if(!box || !isi){

    return;

  }


  if(
    !row.respons_guru &&
    !row.komentar_guru
  ){

    box.classList.add(
      "hidden"
    );

    return;

  }


  let html = "";


  if(
    row.respons_guru === "Suka"
  ){

    html += `
      <span class="feedback-suka">
        👍 Guru menyukai jurnal Anda
      </span>
    `;

  }
  else if(
    row.respons_guru === "Kecewa"
  ){

    html += `
      <span class="feedback-kecewa">
        😞 Guru meminta perhatian terhadap jurnal Anda
      </span>
    `;

  }
  else if(
    row.respons_guru
  ){

    html += `
      <strong>
        Respons:
      </strong>
      ${aman(row.respons_guru)}
    `;

  }


  if(
    row.komentar_guru
  ){

    html += `
      <div class="feedback-komentar">

        <strong>
          💬 Komentar / Motivasi Guru
        </strong>

        <br><br>

        ${aman(row.komentar_guru)}

      </div>
    `;

  }


  isi.innerHTML =
    html;

  box.classList.remove(
    "hidden"
  );

}


/* =====================================================
   AMAN HTML
===================================================== */

function aman(nilai){

  if(
    nilai === null ||
    nilai === undefined
  ){

    return "";

  }


  return String(nilai)
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );

}
