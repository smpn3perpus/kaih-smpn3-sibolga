/* =====================================================
   TANGGAL HARI INI
===================================================== */

function tanggalHariIni(){

  const sekarang = new Date();

  const tahun =
    sekarang.getFullYear();

  const bulan =
    String(
      sekarang.getMonth() + 1
    ).padStart(2,"0");

  const hari =
    String(
      sekarang.getDate()
    ).padStart(2,"0");

  return tahun + "-" + bulan + "-" + hari;
}


/* =====================================================
   PESAN
===================================================== */

function tampilPesan(
  teks,
  sukses = false
){

  const box =
    document.getElementById("pesan");

  if(!box){

    console.log(teks);

    return;
  }

  box.textContent = teks;

  box.className =
    "pesan " +
    (
      sukses
      ? "sukses"
      : "gagal"
    );

  box.style.display = "block";
}


/* =====================================================
   RADIO VALUE
===================================================== */

function radioValue(nama){

  const elemen =
    document.querySelector(
      'input[name="' + nama + '"]:checked'
    );

  return elemen
    ? elemen.value
    : "";
}


/* =====================================================
   SET RADIO
===================================================== */

function setRadio(
  nama,
  nilai
){

  document
    .querySelectorAll(
      'input[name="' + nama + '"]'
    )
    .forEach(function(input){

      input.checked =
        input.value === nilai;

    });

}

      await supabaseClient

/* =====================================================

===================================================== */

    "MENCARI DATA SISWA"
  );

    "AUTH USER ID:",
    user.id
  );

     CARA 1

  ================================================= */

  let hasil =
    await supabaseClient
      .from("siswa")
      .select(`
        id,
        nama,
        nisn,
        username,
        kelas_id,
        guru_wali_id,
        auth_user_id
      `)

        "auth_user_id",

      .maybeSingle();

  let siswa =
    hasil.data;


  /* =================================================
     CARA 2
     JIKA BELUM TERHUBUNG,
     CARI BERDASARKAN NISN DARI EMAIL
  ================================================= */

  if(
    !siswa &&
    user.email
  ){

    const nisn =
      user.email
        .split("@")[0]
        .trim();


    console.log(
      "Mencari NISN:",
      nisn

    const cadangan =
      await supabaseClient
        .from("siswa")
        .select(`
          id,
          nama,
          nisn,
          username,
          kelas_id,
          guru_wali_id,
          auth_user_id
        `)
        .eq(
          "nisn",
          nisn

        .maybeSingle();


    if(cadangan.error){

      throw cadangan.error;

    }


    siswa =
      cadangan.data;

  /* =================================================
     SISWA TIDAK DITEMUKAN
  ================================================= */

  if(!siswa){

    throw new Error(
      "Data siswa tidak ditemukan."
    );

  }


  console.log(
    "SISWA DITEMUKAN:",
    siswa
  );


  /* =================================================
     PASTIKAN ID SISWA VALID
  ================================================= */

  if(
    siswa.id === null ||
    siswa.id === undefined
  ){

    throw new Error(
      "ID siswa kosong."
    );

  }


  /* =================================================
     PASTIKAN GURU WALI ADA
  ================================================= */

    siswa.guru_wali_id === null ||
    siswa.guru_wali_id === undefined

      "Guru wali siswa belum terhubung."

     SIMPAN DATA SISWA
  ================================================= */

    siswa;

    "ID SISWA:",
    siswaLogin.id
  );

  console.log(
    "GURU WALI ID:",
    siswaLogin.guru_wali_id

  /* =================================================
     TAMPIL NAMA
  ================================================= */

  const namaSiswa =
    document.getElementById(
      "namaSiswa"
    );

  if(namaSiswa){

    namaSiswa.textContent =
      siswa.nama || "-";

  }


  /* =================================================
     TAMPIL NISN
  ================================================= */

  const nisnSiswa =
    document.getElementById(
      "nisnSiswa"
    );

  if(nisnSiswa){

    nisnSiswa.textContent =
      siswa.nisn || "-";

  /* =================================================
     TAMPIL KELAS
  ================================================= */

  if(siswa.kelas_id){

    const hasilKelas =
      await supabaseClient
        .from("kelas")
        .select("*")
        .eq(
          "id",
          siswa.kelas_id

        .maybeSingle();


    if(
      !hasilKelas.error &&

        document.getElementById(

     TAMPIL GURU WALI
  ================================================= */

/* =====================================================
   AMBIL GURU WALI TERBARU
===================================================== */

async function ambilGuruWaliTerbaru(){

  if(!siswaLogin){

    throw new Error(
      "Data siswa belum tersedia."
    );

  }


  const hasil =
    await supabaseClient
      .from("siswa")
      .select(
        "id, guru_wali_id"
      )
      .eq(
        "id",
        siswaLogin.id
      )
      .maybeSingle();


  if(hasil.error){

    throw hasil.error;

  }


  if(!hasil.data){

    throw new Error(
      "Data siswa tidak ditemukan."
    );

  }


  const guruId =
    hasil.data.guru_wali_id;


  if(
    guruId === null ||
    guruId === undefined ||
    guruId === ""
  ){

    throw new Error(
      "guru_wali_id siswa masih kosong."
    );

  }


  const guruIdAngka =
    Number(guruId);


  if(
    !Number.isInteger(
      guruIdAngka
    )
  ){

    throw new Error(
      "guru_wali_id bukan angka yang valid: " +
      guruId
    );

  }


  /* =================================================
     PASTIKAN GURU ADA
  ================================================= */

  const guru =
    await supabaseClient
      .from("guru")
      .select("id")
      .eq(
        "id",
        guruIdAngka
      )
      .maybeSingle();


  if(guru.error){

    throw guru.error;

  }


  if(!guru.data){

    throw new Error(
      "Guru ID " +
      guruIdAngka +
      " tidak ditemukan."
    );

  }


  return guruIdAngka;

}


/* =====================================================
   MUAT JURNAL
===================================================== */

async function muatJurnal(){

  if(!siswaLogin){

    return;

  }


  const tanggalElement =
    document.getElementById(
      "tanggal"
    );


  if(!tanggalElement){

    console.warn(
      "Element tanggal tidak ditemukan."
    );

    return;

  }


  const tanggal =
    tanggalElement.value;


  if(!tanggal){

    return;

  }


  const loading =
    document.getElementById(
      "loading"
    );

  const form =
    document.getElementById(
      "formJurnal"
    );


  if(loading){

    loading.style.display =
      "block";

    loading.textContent =
      "⏳ Memuat jurnal...";

  }


  if(form){

    form.classList.add(
      "hidden"
    );

  }


  try{

    const hasil =
      await supabaseClient
        .from("jurnal_7_kaih")
        .select("*")
        .eq(
          "siswa_id",
          siswaLogin.id
        )
        .eq(
          "tanggal",
          tanggal
        )
        .maybeSingle();


    if(hasil.error){

      console.error(
        "ERROR MUAT JURNAL:",
        hasil.error
      );

      throw hasil.error;

    }


    jurnalAktif =
      hasil.data || null;


    if(jurnalAktif){

      console.log(
        "JURNAL DITEMUKAN:",
        jurnalAktif
      );


      isiForm(
        jurnalAktif
      );


      tampilFeedback(
        jurnalAktif
      );

    }
    else{

      console.log(
        "BELUM ADA JURNAL"
      );


      kosongkanForm();


      const feedback =
        document.getElementById(
          "feedback"
        );


      if(feedback){

        feedback.classList.add(
          "hidden"
        );

      }

    }


    if(loading){

      loading.style.display =
        "none";

    }


    if(form){

      form.classList.remove(
        "hidden"
      );

    }


    tampilPesan(
      jurnalAktif
      ?
      "📖 Jurnal ditemukan. Silakan periksa atau perbarui."
      :
      "📝 Silakan isi jurnal hari ini.",
      true
    );

  }
  catch(error){

    console.error(
      "ERROR MUAT:",
      error
    );


    if(loading){

      loading.textContent =
        "❌ Gagal memuat jurnal: " +
        error.message;

    }

  }

}


/* =====================================================
   ISI FORM
===================================================== */

function isiForm(row){

  const jamBangun =
    document.getElementById(
      "jam_bangun"
    );

  if(jamBangun){

    jamBangun.value =
      row.jam_bangun || "";

  }


  setRadio(
    "puasa",
    row.puasa || ""
  );


  const fields = {

    menu_sarapan:
      row.menu_sarapan,

    menu_siang:
      row.menu_siang,

    menu_malam:
      row.menu_malam,

    menu_sahur:
      row.menu_sahur,

    menu_berbuka:
      row.menu_berbuka,

    jenis_olahraga:
      row.jenis_olahraga,

    durasi_olahraga:
      row.durasi_olahraga,

    alasan_olahraga:
      row.alasan_olahraga,

    jenis_bermasyarakat:
      row.jenis_bermasyarakat,

    alasan_bermasyarakat:
      row.alasan_bermasyarakat,

    materi_belajar:
      row.materi_belajar,

    durasi_belajar:
      row.durasi_belajar,

    alasan_belajar:
      row.alasan_belajar,

    jenis_ibadah:
      row.jenis_ibadah,

    alasan_ibadah:
      row.alasan_ibadah,

    jam_tidur:
      row.jam_tidur

  };


  Object.keys(fields)
    .forEach(function(id){

      const el =
        document.getElementById(id);

      if(el){

        el.value =
          fields[id] ?? "";

      }

    });


  setRadio(
    "olahraga",
    row.olahraga || ""
  );


  setRadio(
    "bermasyarakat",
    row.bermasyarakat || ""
  );


  setRadio(
    "belajar_malam",
    row.belajar_malam || ""
  );


  setRadio(
    "ibadah",
    row.ibadah || ""
  );


  ubahOlahraga();
  ubahBermasyarakat();
  ubahBelajar();
  ubahIbadah();

}


/* =====================================================
   KOSONGKAN FORM
===================================================== */

function kosongkanForm(){

  document
    .querySelectorAll(
      'input[type="radio"]'
    )
    .forEach(function(input){

      input.checked = false;

    });


  const ids = [

    "jam_bangun",

    "menu_sarapan",
    "menu_siang",
    "menu_malam",
    "menu_sahur",
    "menu_berbuka",

    "jenis_olahraga",
    "durasi_olahraga",
    "alasan_olahraga",

    "jenis_bermasyarakat",
    "alasan_bermasyarakat",

    "materi_belajar",
    "durasi_belajar",
    "alasan_belajar",

    "jenis_ibadah",
    "alasan_ibadah",

    "jam_tidur"

  ];


  ids.forEach(function(id){

    const el =
      document.getElementById(id);

    if(el){

      el.value = "";

    }

  });


  ubahOlahraga();
  ubahBermasyarakat();
  ubahBelajar();
  ubahIbadah();

}

function ubahOlahraga(){

  const detail =
    document.getElementById(
      "detailOlahraga"
    );

  const alasan =
    document.getElementById(
      "alasanOlahragaBox"
    );


  if(!detail || !alasan){

    return;

  }


  if(nilai === "Ya"){

    detail.classList.remove(
      "hidden"
    );

    alasan.classList.add(
      "hidden"
    );

  }
  else if(nilai === "Tidak"){

    detail.classList.add(
      "hidden"
    );

    alasan.classList.remove(
      "hidden"
    );

  }
  else{

    detail.classList.remove(
      "hidden"

       OLAHRAGA

    alasan_bermasyarakat:
      bermasyarakat === "Tidak"
      ?
      document.getElementById(
        "alasan_bermasyarakat"
      )?.value.trim() || null
      :
      null,


    /* =========================
       BELAJAR
    ========================= */

    belajar_malam:
      belajar_malam,

    materi_belajar:
      belajar_malam === "Ya"
      ?
      document.getElementById(
        "materi_belajar"
      )?.value.trim() || null
      :
      null,

    durasi_belajar:
      belajar_malam === "Ya" &&
      document.getElementById(
        "durasi_belajar"
      )?.value !== ""
      ?
      Number(
        document.getElementById(
          "durasi_belajar"
        ).value
      )
      :
      null,

    alasan_belajar:
      belajar_malam === "Tidak"
      ?
      document.getElementById(
        "alasan_belajar"
      )?.value.trim() || null
      :
      null,


    /* =========================
       IBADAH
    ========================= */

    ibadah:
      ibadah,

    jenis_ibadah:
      ibadah === "Ya"
      ?
      document.getElementById(
        "jenis_ibadah"
      )?.value.trim() || null
      :
      null,

    alasan_ibadah:
      ibadah === "Tidak"
      ?
      document.getElementById(
        "alasan_ibadah"
      )?.value.trim() || null
      :
      null,


    /* =========================
       TIDUR
    ========================= */

    jam_tidur:
      document.getElementById(
        "jam_tidur"
      )?.value || null

  };


  console.log(
    "DATA YANG AKAN DISIMPAN:",
    data
  );


  /* =================================================
     7. CEK NOT NULL
  ================================================= */

  if(
    !data.siswa_id ||
    !data.guru_id ||
    !data.tanggal
  ){

    tampilPesan(
      "❌ siswa_id, guru_id, dan tanggal wajib terisi."
    );

    console.error(
      "DATA TIDAK LENGKAP:",
      data
    );

    return;

  }


  /* =================================================
     8. SIMPAN
  ================================================= */

  tampilPesan(
    "⏳ Menyimpan jurnal..."
  );


  let hasil;


  /* =================================================
     UPDATE
  ================================================= */

  if(jurnalAktif){

    console.log(
      "MODE UPDATE"
    );


    hasil =
      await supabaseClient
        .from("jurnal_7_kaih")
        .update(data)
        .eq(
          "id",
          jurnalAktif.id
        )
        .eq(
          "siswa_id",
          siswaLogin.id
        );

  }


  /* =================================================
     INSERT
  ================================================= */

  else{

    console.log(
      "MODE INSERT"
    );


    hasil =
      await supabaseClient
        .from("jurnal_7_kaih")
        .insert(
          data
        );

  }


  /* =================================================
     9. CEK ERROR
  ================================================= */

  if(hasil.error){

    console.error(
      "ERROR SUPABASE:",
      hasil.error
    );


    tampilPesan(
      "❌ Gagal menyimpan jurnal: " +
      hasil.error.message
    );


    return;

  }


  /* =================================================
     10. BERHASIL
  ================================================= */

  console.log(
    "JURNAL BERHASIL DISIMPAN"
  );


  tampilPesan(
    "✅ Jurnal 7 KAIH berhasil disimpan.",
    true
  );


  await muatJurnal();

}


/* =====================================================
   FEEDBACK GURU
===================================================== */

function tampilFeedback(row){

  const box =
    document.getElementById(
      "feedback"
    );

  const isi =
    document.getElementById(
      "isiFeedback"
    );


  if(!box || !isi){

    return;

  }


  if(
    !row.respons_guru &&
    !row.komentar_guru
  ){

    box.classList.add(
      "hidden"
    );

    return;

  }


  let html = "";


  if(
    row.respons_guru === "Suka"
  ){

    html += `
      <span class="feedback-suka">
        👍 Guru menyukai jurnal Anda
      </span>
    `;

  }
  else if(
    row.respons_guru === "Kecewa"
  ){

    html += `
      <span class="feedback-kecewa">
        😞 Guru meminta perhatian terhadap jurnal Anda
      </span>
    `;

  }
  else if(
    row.respons_guru
  ){

    html += `
      <strong>Respons:</strong>
      ${aman(row.respons_guru)}
    `;

  }


  if(
    row.komentar_guru
  ){

    html += `
      <div class="feedback-komentar">

        <strong>
          💬 Komentar / Motivasi Guru
        </strong>

        <br><br>

        ${aman(row.komentar_guru)}

      </div>
    `;

  }


  isi.innerHTML =
    html;


  box.classList.remove(
    "hidden"
  );

}


/* =====================================================
   AMAN HTML
===================================================== */

function aman(nilai){

  if(
    nilai === null ||
    nilai === undefined
  ){

    return "";

  }


  return String(nilai)
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );

}
