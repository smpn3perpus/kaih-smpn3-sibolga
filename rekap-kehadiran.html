<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Rekap Kehadiran</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* {
  box-sizing: border-box;
  font-family: Arial, sans-serif;
}

body {
  margin: 0;
  background: #f4f7fb;
  color: #222;
}

.header {
  background: #0f4c81;
  color: white;
  text-align: center;
  padding: 25px 15px;
}

.container {
  max-width: 1200px;
  margin: auto;
  padding: 20px;
}

.card {
  background: white;
  border-radius: 15px;
  padding: 20px;
  margin-bottom: 20px;
  box-shadow: 0 4px 15px rgba(0,0,0,.08);
}

.info {
  background: #eef5ff;
  padding: 15px;
  border-radius: 10px;
  line-height: 1.8;
}

.filter {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  align-items: center;
  margin-top: 20px;
}

select {
  padding: 11px;
  border: 1px solid #ccc;
  border-radius: 8px;
  font-size: 15px;
}

button {
  padding: 11px 16px;
  border: none;
  border-radius: 8px;
  color: white;
  font-weight: bold;
  cursor: pointer;
}

.tampil {
  background: #1565c0;
}

.kembali {
  background: #616161;
}

.logout {
  background: #c62828;
}

.table-wrap {
  overflow-x: auto;
}

table {
  width: 100%;
  min-width: 750px;
  border-collapse: collapse;
}

th,
td {
  border: 1px solid #ddd;
  padding: 11px;
  text-align: center;
}

th {
  background: #0f4c81;
  color: white;
}

td:nth-child(2) {
  text-align: left;
}

.pesan {
  display: none;
  padding: 12px;
  border-radius: 8px;
  margin-top: 15px;
}

@media(max-width:700px) {
  .container {
    padding: 10px;
  }

  table {
    font-size: 12px;
  }
}
</style>
</head>

<body>

<div class="header">
  <h1>📊 Rekap Kehadiran</h1>
  <p>SMP Negeri 3 Sibolga</p>
</div>

<div class="container">

<div class="card">

<h2>
👨‍🏫 Guru Wali:
<span id="namaGuru">Memuat...</span>
</h2>

<div class="info">

<strong>Username:</strong>
<span id="usernameGuru">-</span>

<br>

<strong>Siswa Wali:</strong>
<span id="jumlahSiswa">0</span> siswa

</div>

<div id="pesan" class="pesan"></div>

<div class="filter">

<strong>Bulan:</strong>

<select id="bulan">

<option value="1">Januari</option>
<option value="2">Februari</option>
<option value="3">Maret</option>
<option value="4">April</option>
<option value="5">Mei</option>
<option value="6">Juni</option>
<option value="7">Juli</option>
<option value="8">Agustus</option>
<option value="9">September</option>
<option value="10">Oktober</option>
<option value="11">November</option>
<option value="12">Desember</option>

</select>

<select id="tahun"></select>

<button
class="tampil"
onclick="buatRekap()"
>
📊 Tampilkan
</button>

</div>

</div>


<div class="card">

<h2>
📅 Rekap:
<span id="judul">-</span>
</h2>

<div class="table-wrap">

<table>

<thead>

<tr>
<th>No</th>
<th>Nama Siswa</th>
<th>Hadir</th>
<th>Sakit</th>
<th>Izin</th>
<th>Alpa</th>
<th>Total</th>
<th>% Hadir</th>
</tr>

</thead>

<tbody id="tabel">

<tr>
<td colspan="8">
Memuat...
</td>
</tr>

</tbody>

</table>

</div>

</div>


<div class="card">

<button
class="kembali"
onclick="location.href='verifikasi-kehadiran.html'"
>
← Verifikasi Kehadiran
</button>

<button
class="logout"
onclick="logout()"
>
🚪 Keluar
</button>

</div>

</div>


<script>

const SUPABASE_URL =
"https://nnnvgbajiqlqrsaygxme.supabase.co";

const SUPABASE_KEY =
"sb_publishable_dHIoPw_gfvud74PH4UCp2w_yGzl9oDy";

const supabaseClient =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);


let guru = null;
let siswaWali = [];


// ====================================
// PESAN
// ====================================

function pesan(
teks,
sukses = false
) {

const box =
document.getElementById("pesan");

box.textContent = teks;

box.style.display = "block";

box.style.background =
sukses
? "#e8f5e9"
: "#ffebee";

box.style.color =
sukses
? "#2e7d32"
: "#c62828";
}


// ====================================
// TAHUN
// ====================================

function siapkanTahun() {

const select =
document.getElementById("tahun");

const sekarang =
new Date();

const tahunSekarang =
sekarang.getFullYear();

for(
let t = tahunSekarang - 2;
t <= tahunSekarang + 1;
t++
) {

const option =
document.createElement("option");

option.value = t;

option.textContent = t;

if(t === tahunSekarang) {

option.selected = true;

}

select.appendChild(option);

}

document.getElementById("bulan").value =
sekarang.getMonth() + 1;

}


// ====================================
// MULAI
// ====================================

async function mulai() {

siapkanTahun();


const session =
await supabaseClient.auth.getSession();

const user =
session.data.session?.user;


if(!user) {

location.href =
"login-guru.html";

return;

}


// Ambil guru berdasarkan auth_user_id

const hasil =
await supabaseClient
.from("guru")
.select(
"id,nama,username,auth_user_id"
)
.eq(
"auth_user_id",
user.id
)
.maybeSingle();


if(
hasil.error ||
!hasil.data
) {

await supabaseClient.auth.signOut();

location.href =
"login-guru.html";

return;

}


guru =
hasil.data;


document.getElementById(
"namaGuru"
).textContent =
guru.nama || "-";


document.getElementById(
"usernameGuru"
).textContent =
guru.username || "-";


await ambilSiswa();


await buatRekap();

}


// ====================================
// AMBIL SISWA WALI
// ====================================

async function ambilSiswa() {

const hasil =
await supabaseClient
.from("siswa")
.select(
"id,nama,nisn,kelas_id"
)
.eq(
"guru_wali_id",
guru.id
)
.order(
"nama",
{
ascending:true
}
);


if(hasil.error) {

pesan(
"Gagal mengambil siswa: " +
hasil.error.message
);

return;

}


siswaWali =
hasil.data || [];


document.getElementById(
"jumlahSiswa"
).textContent =
siswaWali.length;

}


// ====================================
// REKAP
// ====================================

async function buatRekap() {

const bulan =
Number(
document.getElementById(
"bulan"
).value
);

const tahun =
Number(
document.getElementById(
"tahun"
).value
);


const namaBulan = [
"",
"Januari",
"Februari",
"Maret",
"April",
"Mei",
"Juni",
"Juli",
"Agustus",
"September",
"Oktober",
"November",
"Desember"
];


document.getElementById(
"judul"
).textContent =
namaBulan[bulan] +
" " +
tahun;


const tabel =
document.getElementById(
"tabel"
);


if(siswaWali.length === 0) {

tabel.innerHTML =
`
<tr>
<td colspan="8">
Belum ada siswa yang memilih Anda sebagai Guru Wali.
</td>
</tr>
`;

return;

}


// Tanggal awal bulan

const awal =
`${tahun}-${String(bulan).padStart(2,"0")}-01`;


// Tanggal akhir bulan

const tanggalAkhir =
new Date(
tahun,
bulan,
0
);

const akhir =
`${tahun}-${String(bulan).padStart(2,"0")}-${String(
tanggalAkhir.getDate()
).padStart(2,"0")}`;


const ids =
siswaWali.map(
s => s.id
);


// Ambil seluruh absensi bulan tersebut

const hasil =
await supabaseClient
.from("kehadiran")
.select(
"siswa_id,tanggal,status_siswa,status_final"
)
.in(
"siswa_id",
ids
)
.gte(
"tanggal",
awal
)
.lte(
"tanggal",
akhir
);


if(hasil.error) {

pesan(
"Gagal mengambil kehadiran: " +
hasil.error.message
);

return;

}


const kehadiran =
hasil.data || [];


tabel.innerHTML = "";


let nomor = 1;


siswaWali.forEach(
siswa => {


const data =
kehadiran.filter(
row =>
Number(row.siswa_id) ===
Number(siswa.id)
);


let hadir = 0;
let sakit = 0;
let izin = 0;
let alpa = 0;


data.forEach(
row => {


const status =
row.status_final ||
row.status_siswa;


if(status === "Hadir") {

hadir++;

}

else if(status === "Sakit") {

sakit++;

}

else if(status === "Izin") {

izin++;

}

else if(
status === "Alpa" ||
status === "Tanpa Keterangan"
) {

alpa++;

}

});


const total =
hadir +
sakit +
izin +
alpa;


let persen = 0;


if(total > 0) {

persen =
Math.round(
(hadir / total) * 100
);

}


const tr =
document.createElement("tr");


tr.innerHTML = `

<td>
${nomor}
</td>

<td>
<strong>
${siswa.nama || "-"}
</strong>
</td>

<td>
${hadir}
</td>

<td>
${sakit}
</td>

<td>
${izin}
</td>

<td>
${alpa}
</td>

<td>
<strong>
${total}
</strong>
</td>

<td>
<strong>
${persen}%
</strong>
</td>

`;


tabel.appendChild(tr);


nomor++;

});

}


// ====================================
// LOGOUT
// ====================================

async function logout() {

await supabaseClient.auth.signOut();

location.href =
"login-guru.html";

}


mulai();

</script>

</body>
</html>
