<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Admin KAIH</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      background: #f3f6fa;
    }

    header {
      background: #0f4c81;
      color: white;
      padding: 20px;
    }

    .container {
      max-width: 1100px;
      margin: 25px auto;
      padding: 15px;
    }

    .welcome {
      background: white;
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 20px;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 15px;
    }

    .card {
      background: white;
      padding: 25px;
      border-radius: 12px;
      text-align: center;
    }

    .card h2 {
      font-size: 32px;
      color: #0f4c81;
      margin: 0;
    }

    .logout {
      margin-top: 25px;
      padding: 12px 25px;
      border: 0;
      border-radius: 8px;
      background: #c62828;
      color: white;
      cursor: pointer;
    }

    #status {
      margin-top: 10px;
    }
  </style>
</head>

<body>

<header>
  <h1>KAIH SMP Negeri 3 Sibolga</h1>
  <p>Dashboard Kepala Sekolah / Admin</p>
</header>

<div class="container">

  <div class="welcome">
    <h2>Selamat Datang, Admin 👋</h2>
    <p id="emailAdmin">Memeriksa akun...</p>
    <p id="status"></p>
  </div>

  <div class="cards">

    <div class="card">
      <h2 id="jumlahGuru">0</h2>
      <p>Guru</p>
    </div>

    <div class="card">
      <h2 id="jumlahKelas">0</h2>
      <p>Kelas</p>
    </div>

    <div class="card">
      <h2 id="jumlahSiswa">0</h2>
      <p>Siswa</p>
    </div>

    <div class="card">
      <h2>7</h2>
      <p>Kebiasaan Anak Indonesia Hebat</p>
    </div>

  </div>

  <button class="logout" onclick="logout()">Keluar</button>

</div>

<script>

const SUPABASE_URL = "https://nnnvgbajiqlqrsaygxme.supabase.co/rest/v1/";
const SUPABASE_KEY = "sb_publishable_dHIoPw_gfvud74PH4UCp2w_yGzl9oDy";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


async function mulai() {

  const { data, error } =
    await supabaseClient.auth.getUser();

  if (error || !data.user) {
    window.location.href = "index.html";
    return;
  }

  document.getElementById("emailAdmin").textContent =
    "Login sebagai: " + data.user.email;

  await hitungData();
}


async function hitungData() {

  const hasilGuru =
    await supabaseClient
      .from("guru")
      .select("*", { count: "exact", head: true });

  const hasilKelas =
    await supabaseClient
      .from("kelas")
      .select("*", { count: "exact", head: true });

  const hasilSiswa =
    await supabaseClient
      .from("siswa")
      .select("*", { count: "exact", head: true });


  if (hasilGuru.error) {
    document.getElementById("status").textContent =
      "Guru: " + hasilGuru.error.message;
  } else {
    document.getElementById("jumlahGuru").textContent =
      hasilGuru.count ?? 0;
  }


  if (hasilKelas.error) {
    document.getElementById("status").textContent =
      "Kelas: " + hasilKelas.error.message;
  } else {
    document.getElementById("jumlahKelas").textContent =
      hasilKelas.count ?? 0;
  }


  if (hasilSiswa.error) {
    document.getElementById("status").textContent =
      "Siswa: " + hasilSiswa.error.message;
  } else {
    document.getElementById("jumlahSiswa").textContent =
      hasilSiswa.count ?? 0;
  }
}


async function logout() {

  await supabaseClient.auth.signOut();

  window.location.href = "index.html";
}


mulai();

</script>

</body>
</html>
