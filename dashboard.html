<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Dashboard Admin KAIH</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      background: #f3f6fa;
      color: #222;
    }

    header {
      background: #0f4c81;
      color: white;
      padding: 20px;
    }

    header h1 {
      margin: 0;
      font-size: 24px;
    }

    .container {
      max-width: 1100px;
      margin: 25px auto;
      padding: 15px;
    }

    .welcome {
      background: white;
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 20px;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 15px;
    }

    .card {
      background: white;
      padding: 25px;
      border-radius: 12px;
      text-align: center;
      box-shadow: 0 3px 10px rgba(0,0,0,.08);
    }

    .card h2 {
      font-size: 32px;
      color: #0f4c81;
      margin: 0;
    }

    .menu {
      margin-top: 25px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px;
    }

    .menu a {
      display: block;
      background: white;
      padding: 20px;
      border-radius: 12px;
      text-decoration: none;
      color: #222;
      font-weight: bold;
      box-shadow: 0 3px 10px rgba(0,0,0,.08);
    }

    .menu a:hover {
      background: #eaf1f8;
    }

    .logout {
      margin-top: 25px;
      padding: 12px 25px;
      border: 0;
      border-radius: 8px;
      background: #c62828;
      color: white;
      cursor: pointer;
    }

    #status {
      margin-top: 10px;
      color: #c62828;
    }
  </style>
</head>

<body>

<header>
  <h1>KAIH SMP Negeri 3 Sibolga</h1>
  <p>Dashboard Kepala Sekolah / Admin</p>
</header>

<div class="container">

  <div class="welcome">
    <h2>Selamat Datang, Admin 👋</h2>
    <p id="akun">Memeriksa akun...</p>
    <p id="status"></p>
  </div>

  <!-- STATISTIK -->

  <div class="cards">

    <div class="card">
      <h2 id="guru">0</h2>
      <p>Guru</p>
    </div>

    <div class="card">
      <h2 id="kelas">0</h2>
      <p>Kelas</p>
    </div>

    <div class="card">
      <h2 id="siswa">0</h2>
      <p>Siswa</p>
    </div>

    <div class="card">
      <h2>7</h2>
      <p>Kebiasaan Anak Indonesia Hebat</p>
    </div>

  </div>


  <!-- MENU -->

  <div class="menu">

    <a href="guru.html">
      👨‍🏫 Data Guru
    </a>

    <a href="kelas.html">
      🏫 Data Kelas
    </a>

    <a href="#">
      👨‍🎓 Data Siswa
    </a>

    <a href="#">
      📋 Kehadiran
    </a>

    <a href="#">
      ⭐ Jurnal 7 Kebiasaan
    </a>

    <a href="#">
      📊 Rekap & Laporan
    </a>

  </div>


  <button class="logout" onclick="keluar()">
    Keluar
  </button>

</div>


<script>

// ==========================================
// SUPABASE
// ==========================================

const SUPABASE_URL =
  "https://nnnvgbajiqlqrsaygxme.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_dHIoPw_gfvud74PH4UCp2w_yGzl9oDy";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


// ==========================================
// MULAI
// ==========================================

async function mulai() {

  const hasil =
    await supabaseClient.auth.getUser();

  if (hasil.error || !hasil.data.user) {

    window.location.href = "index.html";

    return;
  }

  const user = hasil.data.user;

  document.getElementById("akun").textContent =
    "Login sebagai: " + user.email;

  hitungData();
}


// ==========================================
// HITUNG DATA
// ==========================================

async function hitungData() {

  const guru =
    await supabaseClient
      .from("guru")
      .select("*", {
        count: "exact",
        head: true
      });

  const kelas =
    await supabaseClient
      .from("kelas")
      .select("*", {
        count: "exact",
        head: true
      });

  const siswa =
    await supabaseClient
      .from("siswa")
      .select("*", {
        count: "exact",
        head: true
      });


  if (guru.error) {

    document.getElementById("status").textContent =
      "Guru: " + guru.error.message;

  } else {

    document.getElementById("guru").textContent =
      guru.count ?? 0;
  }


  if (kelas.error) {

    document.getElementById("status").textContent =
      "Kelas: " + kelas.error.message;

  } else {

    document.getElementById("kelas").textContent =
      kelas.count ?? 0;
  }


  if (siswa.error) {

    document.getElementById("status").textContent =
      "Siswa: " + siswa.error.message;

  } else {

    document.getElementById("siswa").textContent =
      siswa.count ?? 0;
  }

}


// ==========================================
// LOGOUT
// ==========================================

async function keluar() {

  await supabaseClient.auth.signOut();

  window.location.href = "index.html";
}


mulai();

</script>

</body>
</html>
