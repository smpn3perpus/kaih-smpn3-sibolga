<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Admin KAIH</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      background: #f3f6fa;
      color: #222;
    }

    header {
      background: #0f4c81;
      color: white;
      padding: 20px;
    }

    header h1 {
      margin: 0;
      font-size: 24px;
    }

    header p {
      margin: 6px 0 0;
    }

    .container {
      max-width: 1100px;
      margin: 25px auto;
      padding: 0 15px;
    }

    .welcome {
      background: white;
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 20px;
      box-shadow: 0 3px 10px rgba(0,0,0,.08);
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 15px;
    }

    .card {
      background: white;
      padding: 25px;
      border-radius: 12px;
      text-align: center;
      box-shadow: 0 3px 10px rgba(0,0,0,.08);
    }

    .card h2 {
      margin: 0;
      font-size: 32px;
      color: #0f4c81;
    }

    .card p {
      margin-bottom: 0;
      color: #666;
    }

    .logout {
      margin-top: 25px;
      padding: 12px 20px;
      border: none;
      border-radius: 8px;
      background: #c62828;
      color: white;
      cursor: pointer;
    }

    #status {
      margin-top: 15px;
      color: #c62828;
    }
  </style>
</head>

<body>

<header>
  <h1>KAIH SMP Negeri 3 Sibolga</h1>
  <p>Dashboard Kepala Sekolah / Admin</p>
</header>

<div class="container">

  <div class="welcome">
    <h2>Selamat Datang, Admin 👋</h2>
    <p id="emailAdmin">Memeriksa akun...</p>
    <div id="status"></div>
  </div>

  <div class="cards">

    <div class="card">
      <h2 id="jumlahGuru">-</h2>
      <p>Guru</p>
    </div>

    <div class="card">
      <h2 id="jumlahKelas">-</h2>
      <p>Kelas</p>
    </div>

    <div class="card">
      <h2 id="jumlahSiswa">-</h2>
      <p>Siswa</p>
    </div>

    <div class="card">
      <h2>7</h2>
      <p>Kebiasaan Anak Indonesia Hebat</p>
    </div>

  </div>

  <button class="logout" onclick="logout()">
    Keluar
  </button>

</div>

<script>

const SUPABASE_URL = "TEMPEL_PROJECT_URL_DI_SINI";

const SUPABASE_KEY = "TEMPEL_PUBLISHABLE_KEY_DI_SINI";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


async function cekAdmin() {

  const { data, error } =
    await supabaseClient.auth.getUser();

  if (error || !data.user) {

    window.location.href = "index.html";

    return;
  }

  document.getElementById("emailAdmin").textContent =
    "Login sebagai: " + data.user.email;

  const { data: profil, error: profilError } =
    await supabaseClient
      .from("profil_pengguna")
      .select("nama, role")
      .eq("id", data.user.id)
      .single();

  if (profilError || !profil || profil.role !== "ADMIN") {

    document.getElementById("status").textContent =
      "Akun ini bukan akun Admin.";

    return;
  }

  document.getElementById("emailAdmin").textContent =
    "Login sebagai: " + profil.nama;

  hitungData();
}


async function hitungData() {

  const guru =
    await supabaseClient
      .from("guru")
      .select("*", { count: "exact", head: true });

  const kelas =
    await supabaseClient
      .from("kelas")
      .select("*", { count: "exact", head: true });

  const siswa =
    await supabaseClient
      .from("siswa")
      .select("*", { count: "exact", head: true });

  document.getElementById("jumlahGuru").textContent =
    guru.count ?? 0;

  document.getElementById("jumlahKelas").textContent =
    kelas.count ?? 0;

  document.getElementById("jumlahSiswa").textContent =
    siswa.count ?? 0;
}


async function logout() {

  await supabaseClient.auth.signOut();

  window.location.href = "index.html";
}


cekAdmin();

</script>

</body>
</html>
