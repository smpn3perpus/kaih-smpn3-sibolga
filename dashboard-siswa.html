<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
  "https://nnnvgbajiqlqrsaygxme.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_dHIoPw_gfvud74PH4UCp2w_yGzl9oDy";


const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =====================================================
   CEK LOGIN
===================================================== */

async function cekLogin() {

  console.log(
    "================================="
  );

  console.log(
    "MEMERIKSA LOGIN SISWA"
  );


  try {

    const hasil =
      await supabaseClient
        .auth
        .getUser();


    if (hasil.error) {

      console.error(
        "ERROR AUTH:",
        hasil.error
      );

      throw hasil.error;

    }


    const user =
      hasil.data.user;


    console.log(
      "USER LOGIN:",
      user
    );


    if (!user) {

      window.location.href =
        "login-siswa.html";

      return;

    }


    console.log(
      "AUTH USER ID:",
      user.id
    );


    await ambilDataSiswa(
      user.id
    );


  }
  catch (error) {

    console.error(
      "ERROR CEK LOGIN:",
      error
    );


    tampilError(
      "❌ Gagal memuat data siswa: " +
      (
        error.message ||
        error
      )
    );

  }

}


/* =====================================================
   AMBIL DATA SISWA
   MENGGUNAKAN auth_user_id
===================================================== */

async function ambilDataSiswa(
  authUserId
) {

  console.log(
    "Mencari siswa berdasarkan auth_user_id..."
  );


  const hasil =
    await supabaseClient
      .from("siswa")
      .select(`
        id,
        nama,
        nisn,
        kelas_id,
        guru_wali_id,
        auth_user_id
      `)
      .eq(
        "auth_user_id",
        authUserId
      )
      .maybeSingle();


  if (hasil.error) {

    console.error(
      "ERROR QUERY SISWA:",
      hasil.error
    );

    throw hasil.error;

  }


  const siswa =
    hasil.data;


  console.log(
    "DATA SISWA:",
    siswa
  );


  /* =================================================
     SISWA TIDAK DITEMUKAN
  ================================================= */

  if (!siswa) {

    throw new Error(
      "Data siswa belum terhubung dengan akun login. Auth User ID: " +
      authUserId
    );

  }


  /* =================================================
     NAMA SISWA
  ================================================= */

  const namaSiswa =
    document.getElementById(
      "namaSiswa"
    );


  if (namaSiswa) {

    namaSiswa.textContent =
      siswa.nama || "-";

  }


  /* =================================================
     NISN
  ================================================= */

  const nisnSiswa =
    document.getElementById(
      "nisnSiswa"
    );


  if (nisnSiswa) {

    /*
      trim() digunakan untuk menghilangkan
      enter/spasi tersembunyi dari database.
    */

    nisnSiswa.textContent =
      siswa.nisn
      ? String(siswa.nisn).trim()
      : "-";

  }


  /* =================================================
     KELAS
  ================================================= */

  const kelasSiswa =
    document.getElementById(
      "kelasSiswa"
    );


  if (siswa.kelas_id) {

    console.log(
      "Mengambil kelas ID:",
      siswa.kelas_id
    );


    const hasilKelas =
      await supabaseClient
        .from("kelas")
        .select("*")
        .eq(
          "id",
          siswa.kelas_id
        )
        .maybeSingle();


    if (hasilKelas.error) {

      console.error(
        "ERROR KELAS:",
        hasilKelas.error
      );

    }


    console.log(
      "DATA KELAS:",
      hasilKelas.data
    );


    if (
      !hasilKelas.error &&
      hasilKelas.data
    ) {

      const kelas =
        hasilKelas.data;


      if (kelasSiswa) {

        kelasSiswa.textContent =
          kelas.nama ||
          kelas.nama_kelas ||
          kelas.name ||
          "-";

      }

    }
    else {

      if (kelasSiswa) {

        kelasSiswa.textContent =
          "⚠️ Kelas tidak ditemukan";

      }

    }

  }
  else {

    if (kelasSiswa) {

      kelasSiswa.textContent =
        "⚠️ Belum terhubung";

    }

  }


  /* =================================================
     GURU WALI
  ================================================= */

  const guruWaliSiswa =
    document.getElementById(
      "guruWaliSiswa"
    );


  if (siswa.guru_wali_id) {

    console.log(
      "Mengambil guru wali ID:",
      siswa.guru_wali_id
    );


    const hasilGuru =
      await supabaseClient
        .from("guru")
        .select("*")
        .eq(
          "id",
          siswa.guru_wali_id
        )
        .maybeSingle();


    if (hasilGuru.error) {

      console.error(
        "ERROR GURU:",
        hasilGuru.error
      );

    }


    console.log(
      "DATA GURU WALI:",
      hasilGuru.data
    );


    if (
      !hasilGuru.error &&
      hasilGuru.data
    ) {

      const guru =
        hasilGuru.data;


      if (guruWaliSiswa) {

        guruWaliSiswa.textContent =
          guru.nama ||
          guru.nama_guru ||
          guru.name ||
          "-";

      }

    }
    else {

      if (guruWaliSiswa) {

        guruWaliSiswa.textContent =
          "⚠️ Guru tidak ditemukan";

      }

    }

  }
  else {

    if (guruWaliSiswa) {

      guruWaliSiswa.textContent =
        "⚠️ Belum terhubung";

    }

  }


  /* =================================================
     SELESAI
  ================================================= */

  const loading =
    document.getElementById(
      "loading"
    );


  if (loading) {

    loading.style.display =
      "none";

  }


  console.log(
    "DATA SISWA BERHASIL DIMUAT"
  );

  console.log(
    "================================="
  );

}


/* =====================================================
   ERROR
===================================================== */

function tampilError(
  pesan
) {

  const loading =
    document.getElementById(
      "loading"
    );


  if (loading) {

    loading.style.display =
      "none";

  }


  const errorBox =
    document.getElementById(
      "error"
    );


  if (errorBox) {

    errorBox.textContent =
      pesan;

    errorBox.style.display =
      "block";

  }

}


/* =====================================================
   KEHADIRAN
===================================================== */

function bukaKehadiran() {

  window.location.href =
    "kehadiran.html";

}


/* =====================================================
   JURNAL KAIH
===================================================== */

function bukaJurnal() {

  window.location.href =
    "jurnal-kaih.html";

}


/* =====================================================
   LOGOUT
===================================================== */

async function logout() {

  try {

    await supabaseClient
      .auth
      .signOut();

  }
  catch (error) {

    console.error(
      "ERROR LOGOUT:",
      error
    );

  }


  window.location.href =
    "login-siswa.html";

}


/* =====================================================
   MULAI
===================================================== */

document.addEventListener(
  "DOMContentLoaded",
  function() {

    cekLogin();

  }
);

</script>

</body>
