<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
  "https://nnnvgbajiqlqrsaygxme.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_dHIoPw_gfvud74PH4UCp2w_yGzl9oDy";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =====================================================
   VARIABEL
===================================================== */

let siswaLogin = null;


/* =====================================================
   CEK LOGIN
===================================================== */

async function cekLogin() {

  try {

    tampilLoading(true);


    const hasil =
      await supabaseClient
        .auth
        .getUser();


    if (hasil.error) {

      throw hasil.error;

    }


    const user =
      hasil.data.user;


    console.log(
      "USER LOGIN:",
      user
    );


    if (!user) {

      window.location.href =
        "login-siswa.html";

      return;

    }


    await ambilDataSiswa(user);


    tampilLoading(false);

  }

  catch (error) {

    console.error(
      "ERROR CEK LOGIN:",
      error
    );


    tampilLoading(false);

    tampilError(
      "❌ Terjadi kesalahan: " +
      (error.message || error)
    );

  }

}


/* =====================================================
   AMBIL DATA SISWA
===================================================== */

async function ambilDataSiswa(user) {

  console.log(
    "======================================"
  );

  console.log(
    "MENCARI DATA SISWA"
  );

  console.log(
    "AUTH USER ID:",
    user.id
  );


  /*
  =====================================================
  CARA UTAMA:
  CARI BERDASARKAN auth_user_id
  =====================================================
  */

  let hasil =
    await supabaseClient
      .from("siswa")
      .select(`
        id,
        nama,
        nisn,
        username,
        kelas_id,
        guru_wali_id,
        auth_user_id
      `)
      .eq(
        "auth_user_id",
        user.id
      )
      .maybeSingle();


  if (hasil.error) {

    console.error(
      "ERROR CARI SISWA DENGAN AUTH ID:",
      hasil.error
    );

    throw hasil.error;

  }


  let siswa =
    hasil.data;


  /*
  =====================================================
  CADANGAN:
  JIKA auth_user_id BELUM TERISI,
  CARI DENGAN NISN DARI EMAIL
  =====================================================
  */

  if (!siswa && user.email) {

    const nisn =
      user.email
        .split("@")[0]
        .trim();


    console.log(
      "AUTH USER ID TIDAK DITEMUKAN."
    );

    console.log(
      "Mencoba mencari dengan NISN:",
      nisn
    );


    const cadangan =
      await supabaseClient
        .from("siswa")
        .select(`
          id,
          nama,
          nisn,
          username,
          kelas_id,
          guru_wali_id,
          auth_user_id
        `)
        .eq(
          "nisn",
          nisn
        )
        .maybeSingle();


    if (cadangan.error) {

      console.error(
        "ERROR CARI SISWA DENGAN NISN:",
        cadangan.error
      );

      throw cadangan.error;

    }


    siswa =
      cadangan.data;

  }


  /*
  =====================================================
  SISWA TIDAK DITEMUKAN
  =====================================================
  */

  if (!siswa) {

    throw new Error(
      "Data siswa tidak ditemukan. " +
      "Pastikan auth_user_id pada tabel siswa " +
      "sudah terhubung dengan akun login."
    );

  }


  /*
  =====================================================
  DATA SISWA DITEMUKAN
  =====================================================
  */

  siswaLogin =
    siswa;


  console.log(
    "DATA SISWA:",
    siswa
  );


  console.log(
    "ID SISWA:",
    siswa.id
  );

  console.log(
    "NAMA:",
    siswa.nama
  );

  console.log(
    "NISN:",
    siswa.nisn
  );

  console.log(
    "KELAS ID:",
    siswa.kelas_id
  );

  console.log(
    "GURU WALI ID:",
    siswa.guru_wali_id
  );

  console.log(
    "AUTH USER ID:",
    siswa.auth_user_id
  );


  /*
  =====================================================
  TAMPIL NAMA
  =====================================================
  */

  document.getElementById(
    "namaSiswa"
  ).textContent =
    siswa.nama || "-";


  /*
  =====================================================
  TAMPIL NISN
  =====================================================
  */

  document.getElementById(
    "nisnSiswa"
  ).textContent =
    siswa.nisn || "-";


  /*
  =====================================================
  TAMPIL AUTH USER ID
  =====================================================
  */

  document.getElementById(
    "authUserSiswa"
  ).textContent =
    siswa.auth_user_id ||
    user.id ||
    "-";


  /*
  =====================================================
  AMBIL KELAS
  =====================================================
  */

  await ambilKelas(
    siswa.kelas_id
  );


  /*
  =====================================================
  AMBIL GURU WALI
  =====================================================
  */

  await ambilGuruWali(
    siswa.guru_wali_id
  );


  console.log(
    "DATA SISWA SELESAI DIMUAT"
  );

  console.log(
    "======================================"
  );

}


/* =====================================================
   AMBIL KELAS
===================================================== */

async function ambilKelas(
  kelasId
) {

  const elemen =
    document.getElementById(
      "kelasSiswa"
    );


  if (!kelasId) {

    elemen.textContent =
      "⚠️ Belum terhubung";

    console.warn(
      "kelas_id siswa kosong"
    );

    return;

  }


  console.log(
    "Mencari kelas dengan ID:",
    kelasId
  );


  const hasil =
    await supabaseClient
      .from("kelas")
      .select("*")
      .eq(
        "id",
        kelasId
      )
      .maybeSingle();


  if (hasil.error) {

    console.error(
      "ERROR AMBIL KELAS:",
      hasil.error
    );

    elemen.textContent =
      "⚠️ Gagal mengambil kelas";

    return;

  }


  if (!hasil.data) {

    elemen.textContent =
      "⚠️ Kelas tidak ditemukan";

    return;

  }


  const kelas =
    hasil.data;


  console.log(
    "DATA KELAS:",
    kelas
  );


  elemen.textContent =
    kelas.nama ||
    kelas.nama_kelas ||
    kelas.name ||
    "-";

}


/* =====================================================
   AMBIL GURU WALI
===================================================== */

async function ambilGuruWali(
  guruWaliId
) {

  const elemen =
    document.getElementById(
      "guruWaliSiswa"
    );


  if (
    guruWaliId === null ||
    guruWaliId === undefined ||
    guruWaliId === ""
  ) {

    elemen.textContent =
      "⚠️ Belum terhubung";

    console.warn(
      "guru_wali_id siswa kosong"
    );

    return;

  }


  console.log(
    "Mencari guru wali dengan ID:",
    guruWaliId
  );


  /*
  =====================================================
  PASTIKAN ID MENJADI ANGKA
  =====================================================
  */

  const guruId =
    Number(guruWaliId);


  if (
    !Number.isInteger(guruId)
  ) {

    elemen.textContent =
      "⚠️ ID guru tidak valid";

    console.error(
      "guru_wali_id bukan angka:",
      guruWaliId
    );

    return;

  }


  /*
  =====================================================
  CARI GURU
  =====================================================
  */

  const hasil =
    await supabaseClient
      .from("guru")
      .select("*")
      .eq(
        "id",
        guruId
      )
      .maybeSingle();


  if (hasil.error) {

    console.error(
      "ERROR AMBIL GURU:",
      hasil.error
    );

    elemen.textContent =
      "⚠️ Gagal mengambil guru";

    return;

  }


  if (!hasil.data) {

    elemen.textContent =
      "⚠️ Guru tidak ditemukan";

    console.warn(
      "Guru dengan ID " +
      guruId +
      " tidak ditemukan"
    );

    return;

  }


  const guru =
    hasil.data;


  console.log(
    "DATA GURU WALI:",
    guru
  );


  elemen.textContent =
    guru.nama ||
    guru.nama_guru ||
    guru.name ||
    "-";

}


/* =====================================================
   KEHADIRAN
===================================================== */

function bukaKehadiran() {

  window.location.href =
    "kehadiran.html";

}


/* =====================================================
   JURNAL KAIH
===================================================== */

function bukaJurnal() {

  window.location.href =
    "jurnal-kaih.html";

}


/* =====================================================
   LOADING
===================================================== */

function tampilLoading(
  tampil
) {

  const loading =
    document.getElementById(
      "loading"
    );


  if (!loading) return;


  loading.style.display =
    tampil
    ? "block"
    : "none";

}


/* =====================================================
   ERROR
===================================================== */

function tampilError(
  pesan
) {

  const box =
    document.getElementById(
      "errorBox"
    );


  if (!box) return;


  box.textContent =
    pesan;

  box.style.display =
    "block";

}


/* =====================================================
   LOGOUT
===================================================== */

async function logout() {

  try {

    await supabaseClient
      .auth
      .signOut();

  }

  catch (error) {

    console.error(
      "ERROR LOGOUT:",
      error
    );

  }


  window.location.href =
    "login-siswa.html";

}


/* =====================================================
   MULAI
===================================================== */

document.addEventListener(
  "DOMContentLoaded",
  function() {

    cekLogin();

  }
);

</script>

</body>
</html>
